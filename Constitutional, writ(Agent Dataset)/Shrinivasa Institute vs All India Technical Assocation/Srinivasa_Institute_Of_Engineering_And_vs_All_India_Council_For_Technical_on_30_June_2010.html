		23. Since all these Writ Petitions contain identical issues, they are being disposed of in common.

		24. For convenience, let us deal with the facts in  W.P.No.6093 of 2010.  The said facts are as follows :
		24.1. Members of the petitioner association, numbering about 127, have established and are maintaining technical institutions since long back. On 31.12.2009, &quot;The Hindu&quot; carried an advertisement of All India Council for Technical Education (in short, AICTE) in Advt.No.AICTE/12/05/2009 styled as Public Notice for Academic Year 2010-11. It was mentioned in that advertisement that AICTE, in order to promote transparency and accountability in its operations, was in the final phase of introducing e-governance process and revising its procedures for granting approval to the institutions of technical education. It was also mentioned in the advertisement that the institutions seeking approval can upload their proposals on the website of AICTE in the prescribed format latest by 10.02.2010 and that it was mandatory for all the existing AICTE approved Degree and Diploma institutions to upload the information in the prescribed format on the web portal of AICTE to enable the Council to process the applications for academic year 2010-2011. The member institutions of the petitioner submitted compliance report for extension of approval for the academic session 2010-2011 as early as in August 2009.

		24.2. Downloading of the earlier Approval Process Hand Book containing 114 pages was possible only for few institutions.  However, the online application format could not be downloaded from the website for many institutions, since the server was continuously busy and not available. Earlier, Approval Process Hand Book contained 114 pages and the subsequent version which was made available from 10.02.2010 contained only 99 pages. There was yet another Hand Book, containing 110 pages.  The contents of these Hand Books were not similar and there were several changes in the requirement at every stage.

		24.3. When such was the position, the Southern Regional Office of the AICTE directed all the institutions including the existing institutions to submit compliance report once again for the academic year 2010-2011 online even for extension of approval, in spite of the fact that all the institutions had already submitted compliance report as per the existing norms, as early as in August,2009. Since many of the requirements contained in the Hand Book were impracticable of compliance, the petitioner association filed W.P.No.3848 of 2010 before this Court, seeking to issue a writ of declaration declaring that the provisions of Approval Process Hand Book for the year 2010-11 issued by the AICTE  and the letter of the second respondent dated 01.02.2010 are illegal, ultra vires, unconstitutional and unenforceable. On 24.02.2010, this Court granted interim order. 
		24.4. On 09.03.2010, a counter affidavit was filed on behalf of AICTE, in which the specific stand was that the All India Council for Technical Education (Grant of Approvals for Technical Institutions) Regulations,2010, (the impugned Regulations) were published in the Gazette of India in the month of February,2010.  A perusal of the impugned Regulations and the Approval Process Hand Book shows that they have been framed beyond the scope and ambit of the AICTE Act,1987. Therefore, the impugned Regulations are ultra vires as the same are inconsistent with the provisions of the AICTE Act, in particular Section 23 read with Sections 10 and 11 of the Act, and framed contrary to the ground realities.  
		24.5. Insistence on implementing new AICTE scales for teaching and non-teaching staff of the institutions is not immediately feasible of compliance, since pursuant to the judgment of the Apex Court in Inamdar case, the managements of the self-financing institutions, both minority and non-minority, can collect only the fees as approved by the Fee Committee headed by the retired Judge of the High Court.  In the state of Tamil Nadu, Fee Fixation Committee is headed by Hon'ble Mr.Justice N.V.Balasubramaniam.  The current fees approved by the above mentioned Committee is only Rs.32,500/- for government quota seats and Rs.62,500/- for management quota seats. Further, in the State of Tamil Nadu, the consortium of managements of self-financing engineering colleges have surrendered 65% of seats (non-minority) to the Government quota and they have retained only 35% of seats for management quota.  In the case of minority institutions, 50% has been surrendered to Government quota and 50% retained by management quota. With the above mentioned fees structure, it is impossible to implement the new AICTE scale of pay for teaching and non-teaching staff. The above position can be illustrated as follows :
		As per the old salary structure, the engineering colleges were paying the lecturer in the range between Rs.8,000  Rs.13,500; Assistant Professors in the range of Rs.12,000  Rs.18,300 and the Professors in the range of Rs.16,400  Rs.21,000, whereas, as per the new AICTE Scale of Pay, the salary for Assistant Professor is in the range of Rs.15,600  Rs.39,100 and the salary range for Associate Professor and Professor is Rs.37,400  67,000.

		24.6. When such is the situation prevailing in the State of Tamil Nadu, the institutions cannot implement the new AICTE scales of pay until and unless the fees is enhanced by the Fee Fixation Committee. Therefore, Regulation 11.5 of the impugned Regulations imposing penalty for non-fulfilment of adherence to revised pay scales is liable to be struck down. 
		24.7. The situation in Tamil Nadu is further complicated by the fact that there are totally 51,000 seats vacant in all engineering courses conducted by various colleges in the State of Tamil Nadu. Having surrendered 65% by non-minority and 50% by minority institutions to Government quota, the very existence and survival of the institutions are at peril. 	
		24.8. Regulation 11 of the impugned Regulations, apart from civil penalties, also contemplates criminal action by the Council for non-fulfilment of norms and standards, which is hazardous to the institutions.  
		24.9. As per Section 10 (1) (a) of the Act, it is mandatory on the part of the AICTE to undertake survey in various fields of technical education, collect data on related matters and make forecast of the needed growth and development in Technical Education as a condition precedent, but the said mandatory provision has not been complied with.
		24.10. In the previous Regulations, Professors of Applied Sciences Department working in Engineering Colleges were considered eligible for the post of Principal/Director in the AICTE approved institutions, whereas in the new Regulations and the Approval Process Hand Book, the Professors in the Engineering field alone are considered eligible for the post of Principal/Director, which is contrary to ground reality. Prescription of qualifications and service conditions are inter-dependent and inter-related. Conditions of service have to be commensurate with qualifications.  Any qualification fixed without reference to the ground reality is irrational.
		24.11. In the State of Tamil Nadu, for the academic year 2009-2010, more than 51,000 seats were vacant. When such is the ground reality, introduction of &quot;shift system&quot; will create discrimination among urban and rural colleges and further, &quot;shift system&quot; is not contemplated in the Act.

		24.12. Impugned Regulations 4.3 and 4.6 empower the Council to prescribe Approval Process Hand Book from time to time, which is not in conformity with Sections 23 and 24 of the Act, and, therefore, the same are ultra vires and unconstitutional. The Approval Process Hand Book was published much before the impugned Regulations and in the impugned Regulations, the AICTE has been conferred with wide powers to change the Approval Process Hand Book from time to time, which is arbitrary and unreasonable.  
		24.13. Due to downloading problems and connectivity to the Server, the web portal is not reliable. Confidentiality of the information of the institution is at stake; there is no protection mechanism in the new norms and, therefore, Regulations 4.12 and 4.21 are arbitrary. Impugned Regulation 4.14 provides for State Government/Union Territory administration and the affiliating University to forward their views on the applications under the impugned Regulations 4.1 and 4.2 within a prescribed date.  Since the application is uploaded through web portal, it is impracticable for the State and the University to forward their views and hence the impugned Regulation 4.14 is arbitrary.  
		24.14. The requirement in the impugned Regulation 4.19 that the Council shall grant approval only after the applicant institution fulfils the norms and stands as prescribed in the impugned Regulations is arbitrary, contrary to ground reality and impossible of performance.
		24.15. Impugned Regulation 4.21 that the institutions shall comply with the 2010 norms within time schedule prescribed in the Approval Process Hand Book is arbitrary since several of the new requirements are contrary to ground reality. In view of the above mentioned arbitrary requirements, Regulation 4.33 stating that the Council shall not grant any conditional approval to any institution is liable to be struck down. Hence, the Writ Petition.

		25. AICTE has filed a counter affidavit, stating that the new Regulations were framed taking into consideration of various issues; the letter dated 01.02.2010 was only a communication which was issued with an intention to bring to the notice of the institutions the new regulations, as a matter of precaution in order to ensure that the institutions may by oversight or otherwise fail to take note of the new regulations, which came into effect from 09.01.2010; the regulations framed by the competent authority cannot be challenged as onerous as long as the authority has the powers to frame the regulations and as long as they are not violative of any fundamental rights enshrined in the Constitution of India and they are within the legislative competence.  A law can be struck down, if it is a fiscal law on the ground of non-compliance of the mandatory procedures contemplated for its enactment.  The new Regulations are issued in supersession of the existing earlier regulations. The new Regulations have been framed with authority of law under Section 23 (1) of the AICTE Act read with Sections 10 and 11 and notified in the Gazette of India, dated 06.02.2010, and there is no violation of Article 14 of the Constitution of India. AICTE is fully competent to prescribe the qualifications of faculty and as such the institutions which are falling under the purview of the AICTE Act could not complain of the same.  Further, prescription of qualification of faculty cannot be challenged on the ground of a vague statement of non-availability of such qualified faculty and that again cannot be a ground for challenging the entire regulations. The Regulations are applicable to both government colleges and self-finance colleges.  The Regulations are applicable even to Universities, both Government and private. The time limit for uploading the requirements sought for in the new regulations impugned in the writ petitions has already been extended up to 10.03.2010 for new institutions and for existing institutions up to 15.03.2010. It is denied that the circulars/letters could not be opened up to 15.02.2010 and in any case that cannot be a ground urged to strike down the Regulations, as a Regulation needs to be challenged on its merits and demerits, legality and competence and not on the basis of the opening or non-opening of some pages of the letter intimating to the institutions about the requirement of compliance of the Regulations, which is only an additional measure.

		25.1. AICTE being the statutory authority empowered to regulate technical education and also prescribe the norms for admission, which is not disputed by the writ petitioners,  it is entirely within the power of the AICTE to prescribe the percentage of admission for NRI students, which was down taking into consideration of many factors, including that of the requirement of the Indian students to be accommodated in higher technical education.  The time limit that has been fixed for receipt of the information is directly related to time table fixed for the consequential discharge of statutory duties such as inspection, issuance of approval and thereafter affiliation followed by admission, which should be completed before the commencement of the next academic year.

		26. The contentions of Mr.A.K.Ganguli, learned Senior Counsel, appearing for the petitioner are as follows :

		26.1. The impugned Regulations of 2010 are ultra vires of the provisions of the Act. Though the impugned Regulations are purported to have been framed in exercise of the powers of the Council under Section 23 (1) read with Sections 10 and 11 of the Act, they are not in conformity with the scheme and the object of the Act and therefore they are beyond the powers of the Council under Section 23 and are liable to be declared as invalid.  He would also contend that Regulations 4.3 and 4.6, read together, entitle the Council not only to prescribe procedure for processing the applications for various purposes listed under Regulation 4.1, but also they have gone to the extent of enabling the Council to lay down the norms and standards and requirements for grant of approval as prescribed in &quot;Approval Process Hand Book&quot; from time to time, which is clearly ultra vires of Section 10 of the Act. 
		26.2. Regulation 4.3 read with 4.6 virtually dispenses with the requirement of norms and standards being prescribed by the Regulations even though the Act contemplates that the norms and standards could be prescribed by Regulations, that too by notification published in the official gazette.  By virtue of these regulations, the Council has conferred upon itself unchanalised powers to prescribe norms and standards by mere administrative orders without checks and balances by the Legislature or any other authority.  
		26.3. Upon the power conferred under these Regulations for prescribing norms and standards under the Approval Process Hand Book, the Council has also sought to empower the same to introduce new norms and standards at any point of time by use of the expression from time to time in Regulation 4.3 as well as 4.6. The Act does not confer such unguided and unbridled powers on the Council to deal with such important subjects like prescribing norms and standards for technical education by mere executive orders from time to time.

	26. The principal of &quot;legitimate expectation&quot; is still at a stage of evolution as pointed out in de Smith's Administrative Law (5th Edn.) (para 8.038).  The principle is at the root of the rule of law and requires regularity, predictability and certainty in the Government's dealings with the public.  Adverting to the basis of legitimate expectation its procedural and substantive aspects, Lord Steyn in Pierson v. Secy. of State (All ER at p.606) goes back to Dicey's description of the rule of law in his Introduction to the Study of the Law of the Constitution (10th Edn., 1959, p. 203) as containing principles of enduring value in the work of a great jurist.  Dicey said that the constitutional rights have roots in the common law.  He said:

	&quot;The 'rule of law', lastly, may be used as a formula for expressing the fact that with us the law of constitution, the rules which in foreign countries naturally form part of a constitutional code, are not the source but the consequence of the rights of individuals, as defined and enforced by the courts; that, in short, the principles of private law have with us been by the action of the courts and Parliament so extended as to determine the position of the Crown and its servants, thus the constitution is the result of the ordinary law of the land&quot;.

	This, says Lord Steyn, is the pivot of Dicey's discussion of rights to personal freedom and to freedom of association and of public meeting and that it is clear that Dicey regards the rule of law as having both procedural and substantive effects.  &quot;[T]he rule of law enforces minimum standards of fairness, both substantive and procedural.&quot;  On the facts in Pierson the majority held that the Secretary of State could not have maintained a higher tariff of sentence than recommended by the judiciary when admittedly no aggravating circumstances existed.  The State could not also increase the tariff with retrospective effect.
			
	27. The basic principles in this branch relating to legitimate expectation were enunciated by Lord Diplock in Council of Civil Service Unions v. Minister for the Civil Service at pp.408-409. It was observed in that case that for a legitimate expectation to arise, the decisions of the administrative authority must affect the person by depriving him of some benefit or advantage which either 

	(i) he had in the past been permitted by the decision-maker to enjoy and which he can legitimately expect to be permitted to continue to do until there has been communicated to him some rational grounds for withdrawing it on which he has been given an opportunity to comment; or 
	(ii) he has received assurance from the decision-maker that they will not be withdrawn without giving him first an opportunity of advancing reasons for contending that they should not be withdrawn. 

The procedural part of it relates to a representation that a hearing or other appropriate procedure will be afforded before the decision is made. The substantive part of the principle is that if a representation is made that a benefit of a substantive nature will be granted or if the person is already in receipt of the benefit that it will be continued and not be substantially varied, then the same could be enforced. In the above case, Lord Fraser accepted that the civil servants had a legitimate expectation that they would be consulted before their trade union membership was withdrawn because prior consultation in the past was the standard practice whenever conditions of service were significantly altered. Lord Diplock went a little further when he said that they had a legitimate expectation that they would continue to enjoy the benefits of the trade union membership. The interest in regard to which a legitimate expectation could be had must be one which was protectable. An expectation could be based on an express promise or representation or by established past action or settled conduct. The representation must be clear and unambiguous. It could be a representation to the individual or generally to a class of persons.

[See in this connection Mr Dotans article Why Administrators Should be Bound by Their Policies (Vol. 17) 1997 Oxford Journal of Legal Studies, p.23.] But today the rigidity of the above decisions appears to have been somewhat relaxed to the extent of application of the Wednesbury rule whenever there is a change in policy and we shall be referring to these aspects presently

		55. It is well settled that a subordinate legislation can be challenged when there is (a) lack of legislative competence to make it; (b) violation of fundamental rights guaranteed under the Constitution of India; (c) violation of any provision of the Constitution of India; (d) failure to conform to the statute under which it is made or exceeding the limits of authority conferred by the enabling Act; (e) repugnancy to the laws of the land, that is, any enactment and (f) manifest arbitrariness/unreasonableness. The court considering the validity of a subordinate legislation, will have to consider the nature, object and scheme of the enabling Act, and also the area over which power has been delegated under the Act and then decide whether the subordinate legislation conforms to the parent statute. Where a rule is directly inconsistent with a mandatory provision of the statute, then, of course, the task of the court is simple and easy. But, where the contention is that the inconsistency or non-conformity of the rule is not with reference to any specific provision of the enabling Act, but with the object and scheme of the parent Act, the court should proceed with caution before declaring invalidity. The validity of a subordinate legislation is open to question if it is ultra vires the Constitution or the governing Act or repugnant to the general principles of the laws of the land or is so arbitrary or unreasonable that no fairminded authority could ever have made it. A subordinate legislation would not enjoy the same degree of immunity as a legislative act would. It is very common for the legislature to provide for a general rule-making power to carry out the purpose of the Act. When such a power is given, it may be permissible to find out the object of the enactment and then see if the rules framed satisfy the test of having been so framed as to fall within the scope of such general power confirmed. If the rule-making power is not expressed in such a usual general form, then it shall have to be seen if the rules made are protected by the limits prescribed by the parent Act. 
		56. A delegated power to legislate by making rules for carrying out the purposes of the Act is a general delegation without laying down any guidelines and it cannot be so exercised as to bring into existence substantive rights or obligations or disabilities not contemplated by the provisions of the Act itself.

		57. The above principle has been laid down in many rulings of the Supreme Court as referred to above and the Supreme Court repeated the same in the case of State of Tamil Nadu v. P.Krishnamurthy, reported in (2006) 4 SCC 517. In the said case, the test of deciding the constitutional validity of a subordinate legislation has been laid down. It is held therein that the Court considering the validity of a subordinate legislation will have to consider the nature, object and scheme of the enabling Act and also the area over which power has been delegated under the Act and then decide whether the subordinate legislation conforms to the parent statute. Similar view was also taken by the Supreme Court in State of M.P. and another v. Bhola alias Bhairon Prasad Raghuvanshi, (2003) 3 SCC 1, wherein the issue in question was when a delegated legislation can be declared invalid. It is held therein that a delegated legislation can be declared invalid mainly on two grounds  viz., (i) when it is in violation of any provision of the Constitution and (ii) when it is in violative of the enabling Act. 
		
		58. In Grand Kakatiya Sheraton Hotel &amp; Towers Employees &amp; Workers Union v. Srinivasa Resorts Ltd., (2009) 5 SCC 342, the Supreme Court held that  the High Court has correctly observed that even if the law cannot be declared ultra vires on the ground of hardship, it can be so declared on the ground of total unreasonableness applying Wednesburys unreasonableness principles. The Court, specifically, has also found that this reasonableness (sic unreasonableness) is apparent from the fact that the employees falling within sub-sections (1) and (3), although from different classes, had been treated equally, giving them the same benefit. For this purpose, the Court also relied on the observations made in Bennett Coleman &amp; Co. v. Union of India, 1972 (2) SCC 788. The High Court also referred to the observations made in Peerless General Finance and Investment Co. Ltd. v. RBI, 1992 (2) SCC 343 in this behalf and rightly concluded that the impugned provision was totally unreasonable.
		59. Further, in State of T.N. v. Adhiyaman Educational &amp; Research Institute, (1995) 4 SCC 104, the Apex Court has categorically held that the provisions of the Act including its preamble make it abundantly clear that the Council has been established under the Act for coordinated and integrated development of the technical education system at all levels throughout the country and is enjoined to promote qualitative improvement of such education in relation to planned quantitative growth. The Council is also required to regulate and ensure proper maintenance of norms and standards in the technical education system. The Council is further to evolve suitable performance appraisal system incorporating such norms and mechanisms in enforcing their accountability. It is also required to provide guidelines for admission of students and has power to withhold or discontinue grants and to de-recognise the institutions where norms and standards laid down by it and directions given by it from time to time are not followed. This duty and responsibility cast on the Council implies that the norms and standards to be set should be such as would prevent a lopsided or an isolated development of technical education in the country. For this purpose, the norms and standards to be prescribed for the technical education have to be such as would on the one hand ensure development of technical educational system in all parts of the country uniformly; that there will be a coordination in the technical education and the education imparted in various parts of the country and will be capable of being integrated in one system; that there will be sufficient number of technically educated individuals and that their growth would be in a planned manner; and that all institutions in the country are in a position to properly maintain the norms and standards that may be prescribed by the Council. The norms and standards have, therefore, to be reasonable and ideal and at the same time, adaptable, attainable and maintainable by institutions throughout the country to ensure both quantitative and qualitative growth of the technically qualified personnel to meet the needs of the country. Since the standards have to be laid down on a national level, they have necessarily to be uniform throughout the country without which the coordinated and integrated development of the technical education all over the country will not be possible which will defeat one of the main objects of the statute.... They have, therefore, a say in the matter of laying down the norms and standards which may be prescribed by the Council for such education from time to time... The provisions of the law if repugnant to the provisions of the Central Act would stand impliedly repealed to the extent of repugnancy and such repugnancy would have to be adjudged on the basis of the tests which are applied for adjudging repugnancy under Article 254 of the Constitution.


		60. On a cursory reading of the entire provisions of the Regulations,2010, even word by word, what comes to be known is, that, except the penal provisions, the Regulations are in conformity with the statute and are in furtherance of achieving the object of the enabling Act and it is not shown to this Court that the authority has exceeded its limits in framing the regulations. But, on the penal provisions, it is not made out by the Council as to under what authority of law, it can proceed against the institutions for penal action. In the absence of any inconsistency with the provisions of the Act, this Court cannot sit in appeal over examining the correctness or validity of the regulations. Therefore, the delegating power for the authority, which made the legislation/regulations, is in conformity with the provisions of the Act and that delegation when not exceeded, except the penal provision under Clause 11.1 of the Regulations, this Court is not in agreement with the contention raised by the petitioners that the entire regulations are ultra vires of the Act. Hence, the regulations are in conformity with the provisions of the Act and in furtherance of the object of the enabling Act and there is no infringement of any of the fundamental rights. Therefore, no interference is required in the said regulations. However, Regulation 11.1, which authorises civil and criminal action against the defaulting institutions, is not contemplated under the provisions of Act. Therefore, it is ultra vires of the enabling Act.  In such a situation, there is no other scope for this Court except to confirm the validity of the Regulations 2010, excluding Clause 11.1, which is a penal provision, made without the authority of law.

Subordinate Legislation : Scope of Judicial Review  -
		61. On the question of scope of judicial review, learned Senior Counsel appearing for the AICTE would strenuously contend on the plea of ouster of the court's jurisdiction, that in essence, the position with regard to the justiciability of exercise of the policy decision by the authority is limited.  While exercising the power of judicial review of the authority, the court is not the appellate authority and the law does not permit the court to direct or advise the authority in the matter of the policy, which exclusively lies under the Constitution within the sphere of the Legislature or the Executive.  The only scope is while examining the Policy, the Government has to check whether it violates the fundamental rights of the citizens or is opposed to the provisions of the Constitution or opposed to any enabling Act or manifestly arbitrary.  In the absence of any such thing, the petitioner has no right to challenge the Regulation framed by the competent authority.  On the other hand, learned Senior Counsel appearing for the petitioners have pointed out that the respondents, who have framed the Regulations, transgressed their statutory power, affecting the constitutional rights of the petitioners and the Regulations have been arbitrarily and unreasonably made in a hasty manner.  Therefore, this has to be judicially reviewed by this court within the ambit of the framework of the judicial review. 

		62. The law is well settled. The constitutional system of Government abhors absolutism and it being the cardinal principle of our Constitution that no one, howsoever lofty, can claim to be the sole judge of the power given under the Constitution, mere co-ordinate constitutional status, or even the status of an exalted constitutional functionaries, does not disentitle this court from exercising its jurisdiction of judicial review of actions which partake the character of judicial or quasi-judicial decision.  The power of judicial review is a constituent power and cannot be abdicated by judicial process of interpretation. However, justiciability of the decision taken by the authority is an exercise of power by the court hedged by self-imposed judicial restraint.  The courts are entitled to examine as to whether those circumstances were existing when the decision was made.  In other words, the existence of the circumstances in question is open to judicial review, though the opinion formed by the authority is not amenable to review by the courts.  This can be done by the courts while confining this to the acknowledged parameters of the judicial review namely, illegality, irrationality and mala fides.  Such scrutiny of the materials will also be within the judicially discoverable and manageable standards.

		63. In Ekta Shakti Foundation's case reported in (2006) 10 SCC 337, the Supreme Court has held that while exercising the power of judicial review of administrative action, the court is not the Appellate Authority and the Constitution does not permit the court to direct or advise the executive in the matter of policy or to sermonize quo any matter, which under the Constitution lies within the sphere of the legislature or the executive, provided these authorities do not transgress their constitutional limits or statutory power.  Similarly, in the case of Directorate of Film Festivals reported in (2007) 4 SCC 737, the scope of judicial review of governmental policy has been well defined. In the said judgment, the Supreme Court has held that courts do not and cannot act as Appellate Authorities examining the correctness, suitability and appropriateness of a policy, nor are courts advisors to the executive on matters of policy which the executive is entitled to formulate.  The scope of judicial review when examining a policy of the Government is to check whether it violates the fundamental rights of the citizens or is opposed to any statutory provision or manifestly arbitrary.  In the case of Basic Education Board, U.P. vs. Upendra Rai and others reported in (2008) 3 SCC 432, a similar view was taken by the Supreme Court that the court cannot interfere with policy decision of the Government unless it is in violation of some statutory or constitutional provision.  

		64. In the instant case, on examination of the Regulations challenged, it is seen that there is no lack of competency to make the above subordinate legislation, namely, the Regulations and it is not made out that it has infringed the fundamental rights also.  While examining the above Regulations, it is also found that it is not opposed to the provisions of the Constitution or the enabling Act and in the absence of any arbitrariness and unreasonableness, the cardinal principles laid down by the Supreme Court holding that the courts cannot interfere with the Policy either on the ground that it is erroneous or on the ground that a better, fairer, or wiser alternative is available.  Legality of the Policy, and not the wisdom or soundness of the policy, is the subject of judicial review.  AICTE has framed the regulations to improve the standard of technical education, which is a welcome measure. This court does not find any of the violations as stated supra and the scope of judicial review of the above Regulations is not made out except to one clause i.e., Regulation 11.1, which provides for civil and criminal action against the institutions, which is not contemplated under the enabling Act. Therefore, the regulations, except Regulation 11.1, are valid.

Policy Decisions  Interference of Court :
		65. With regard to the interference of court in Policy Decisions, learned Senior Counsel appearing for the petitioners would strenuously contend that any Regulation will be repugnant, if it is not in conformity with the object and scheme of the provisions of the Act.  Even if the law can be declared ultra vires on the ground of arbitrariness and total unreasonableness when any criterion is fixed by a statute or by a Policy, an admission should be made by the authority making delegated legislation to follow the Policy formulation broadly and substantially and in conformity therewith. Therefore, the Regulations must conform to the provisions of the Act and if it is not so, the provisions of the Constitution mandates that even the Policy decision can be subjected to judicial review and subordinate legislation may be struck down.  Per contra, learned Senior Counsel appearing for the AICTE while refuting the above contention, would contend that the right of the State to change its policy from time to time under the changing circumstances could not be challenged on the ground of arbitrariness or unreasonableness.  When the petitioner questions the validity of the Government Policy, it is not normally within the domain of any court, to weigh the pros and cons of the policy or to scrutinize it and test the degree of its beneficial or equitable disposition for the purpose of varying, modifying or annulling it, based on howsoever sound and good reasoning, except where it is arbitrary or violative of any constitutional, statutory or any other provisions of the enabling act.  

		66. In the case of State of Punjab vs. Ram Lubhaya Bagga and others reported in (1998) 4 SCC 117, it was held that so far as questioning the validity of governmental policy is concerned, it is not normally within the domain of any court, to weigh the pros and cons of the policy or to scrutinize it and test the degree of its beneficial or equitable disposition for the purpose of varying, modifying or annulling it, based on howsoever sound and good reasoning, except where it is arbitrary or violative of any constitutional, statutory or any other provision of law. In the case of Ugar Sugar Works Ltd. reported in (2001) 3 SCC 635, the Supreme Court has held that if the policy cannot be faulted on grounds of malafide, unreasonableness, arbitrariness or unfairness, the mere fact that it would hurt business interests of a party, does not justify invalidating the policy. In tax and economic regulation cases, there are good reasons for judicial restraint, if not judicial deference, to judgment of the executive. The courts are not expected to express their opinion as to whether at a particular point of time or in a particular situation any such policy should have been adopted or not.  It is best left to the discretion of the State.

		67. In the case of Balco Employees Union reported in (2002) 2 SCC 333, the Supreme Court has held that in a democracy, it is the prerogative of each elected Government to follow its own policy. Often a change in Government may result in the shift in focus or change in economic policies. Any such change may result in adversely affecting some vested interests. Unless any illegality is committed in the execution of the policy or the same is contrary to law or mala fide, a decision bringing about change cannot per se be interfered with by the court. In Ekta Sakthi Foundation' case  referred to above, the Supreme Court has held that the scope of judicial enquiry is confined to the question whether the decision taken by the Government is against any statutory provisions or is violative of the fundamental rights of the citizens or is opposed to the provisions of the Constitution. 

		68. In the case of Vasu Dev Singh and others vs. Union of India and others reported in (2006) 12 SCC 753, the Supreme Court has held that a legislative policy must conform to the provisions of the constitutional mandates. Even otherwise, a policy decision can be subjected to judicial review.  It was further held therein that a subordinate legislation may be struck down as arbitrary or contrary to statute if it fails to take into account very vital facts which either expressly or by necessary implication are required to be taken into consideration by the statute or, say, the Constitution, which can only be done on the ground that it does not conform to the statutory or constitutional requirements or that it offends Article 14 or Article 19(1)(a) of the Constitution. It cannot, no doubt, be done merely on the ground that it is not reasonable or that it has not taken into account relevant circumstances which the Court considers relevant.  The Supreme Court has categorically held that a subordinate legislation would not enjoy the same degree of immunity as a legislative act would. 

		69. While analysing the above legal position in the matter of policy decision or exercise of discretion by the Government, so long as infringement of fundamental rights is not shown, the courts will have no occasion to interfere and the court should not substitute its own judgment for that of the executive in such matters.  The Regulations issued by the AICTE are no way in infringement of any fundamental rights and are contrary to the provisions of the Act and therefore, such Policy decision has been exercised with the discretion of the authority based on the changing needs of the technical education and such a Policy conforms to the provisions of the Act and this court cannot sit in appeal to examine the correctness of such Policy.  It is not normally within the domain of any court to weigh the pros and cons of the Policy or to scrutinise it and test the degree of its beneficial or equitable disposition for the purpose of varying, modifying or annulling it.  

		70. When Government forms its policy, it is based on a number of circumstances on facts, law including constraints based on its resources.  It is also based on expert opinion.  It would be dangerous if Court is asked to test the utility, beneficial effect of the policy or its appraisal based on facts set out on affidavits.  The Court would dissuade itself from entering into this realm which belong to the executive.  It is within this matrix that it is to be seen whether the new policy violates Article 21.  Courts will interfere only if there is a clear violation of constitutional or statutory provisions or non-compliance by the State with its constitutional or statutory duties.    

		71. In this case, this Court does not see any violation of the constitutional or statutory provisions in framing the regulations.  In other words, the regulations framed by AICTE are well within its powers, except Regulation 11.1.  So, no interference is called for with the same.

Whether the Regulations are Prospective or Retrospective in nature ?
		72. According to the learned Senior Counsel for the petitioners, as per the provision under Section 10(a) of the Act , the norms and standards fixed under the impugned Regulations can be done only by conducting appropriate survey and collecting data and following the rational method to change the Regulations. The norms and standards prescribed under the new Regulations are in various aspects different from the norms and standards of 2006 Regulations.  As per 2006 Regulations, the existing Institutions submitted  an explanation for extension of approval, additional intake etc., in time.  The Council has not processed those applications which were made in time.  At the fag end of the year, i.e. on 31.12.2009, the Council chose to publish a notification purporting to inform all the Institutions that the Council was in the final phase of introducing e-governance process and revising the procedure for granting approval to the applicants of the existing Technical Institutions and for the establishment of new Technical Institutions, kicking off programmes, new courses, additional intakes, extension of approval and thereafter it has intended to address the respective Institutions to submit revised representations by uploading the same in the web portal with the AICTE by 28.02.2010. The Gazette notification of the new Regulation dated 15.01.2010 was published on 06.02.2010.  According to the learned counsel, it will have prospective effect and it cannot have retrospective effect to those institutions who have applied already, i.e. before 31.08.2009.  Circumventing the above submission, learned Senior Counsel appearing for the AICTE would submit that the Regulations which are framed by the Council are applicable to the petitioners and their applications are to be processed as per the new Regulation and they cannot claim that the applications should be processed based on 2006 Regulations.  

		73. As per the Existing Regulations, the existing institutions submitted applications within the prescribed time viz., 31.08.2009 for the academic session 2010-2011 for extension of approval, additional intake etc. But, the Council has not processed these applications which were in time. Surprisingly, at the fag end of the year on 31.12.2009, the Council chose to publish a notification, purporting to inform all the institutions that the Council was in the final phase of introducing e-governance process and revising its procedure for granting approval for the following types of applications of technical institutions :
	(a) Establishment of new technical institutions including integrated campus.

	(b) Starting of new programs, new courses, additional divisions and change in intake in the existing AICTE approved technical institutions.

	(c) Extension of approval for the existing AICTE approved technical institutions.

	(d) Provision of seats for PIO/NRI category/Tuition Fee Waiver Schemes.


	(e) Entry and operation of foreign universities/institutions/collaborations imparting technical education in India.

	(f) Closure of AICTE approved courses.
	(g) Second shift institutions/courses.

		74. Even in the said public notice published in December 2009, there is no whisper that the Council was going to introduce a new set of regulations which were yet to be framed and published. On the contrary, towards the end of the said public notice, the Council reassured all the institutions that all pending accreditation proposals will also be processed from 10th January as per the norms and procedures existing before June,2009, and that applications received after June,2009, will be processed as per the new norms and procedures.  However, these applications need to upload afresh on the web portal www.nba.india.org in the revised formats giving the details of the processing fee if already remitted.

		75. Subsequently, by a letter dated 01.02.2010 addressed to the institutions, the Council required the institutions to submit revised reports by uploading the same in the web portal of the Council by 28.02.2010.  Even in this communication, there was no suggestion that the Council was framing new Regulations revising the earlier norms and standards and even the existing institutions will have to comply with the same. By another public notice dated 07.02.2010, the Council informed the institutions the various softwares that would be required for the institutions concerned for uploading the compliance report.   

		76. The above acts of the Council would go to show the intention of the Council to apply new regulations to the existing institutions, which will have some adverse consequences.  Therefore, if the new regulations are given retrospective effect, it will adversely affect the institutions, which are with a legitimate expectation that their applications would be processed in time in order to proceed with the admissions for the academic year 2010-2011. Though many decisions of the Supreme Court have been pointed out stating that the law as on the date of process of application has to be applied, in the given peculiar facts and circumstances of the case, as there were existing regulations, the petitioners have applied with a fond hope that their applications would be processed as per the said regulations. In such view of the matter, while giving due consideration to the law laid down by the Supreme Court, in this case, the petitioners had already submitted applications but the same were not processed. Now, the intention of the Council to bring in new regulations in furtherance of the Act in order to have transparency and accountability is certainly a factor to be taken note of, but it is for the prospective effect and it cannot be given retrospective effect. In addition, in paragraph 12 of the additional counter affidavit, dated 18.03.2010, filed on behalf of AICTE in W.P.No.3848 of 2010, it has been categorically admitted by the Council as follows :

	&quot;12. I respectfully submit that it is also clarified that the new norms and standards specified vide Regulations published on 6th February 2010 shall have prospective effects. It means that the ongoing technical education programmes in existing technical institutions shall not be affected adversely. If the existing institutions intend to start new programmes or courses etc. their applications for these programmes shall be evaluated as per the new Regulations. However, the new Regulations will be fully applicable for the applications seeking approval for establishment of new technical institutions. However, all the applications, whether for establishment of new institution or seeking various kinds of approval by the existing institutions are required to be filled on line on the web portal of AICTE.&quot;

		77. It is admitted by AICTE in paragraph 10 of the additional counter that there is shortage of M.Tech.faculty and the existing colleges would be allowed to recruit B.Tech.Degree holders with such requirements as given in the earlier Regulations. But, in paragraph 12 of the same counter, it is stated that if the existing colleges apply for new courses/additional intake in existing courses, then, they have to comply with 2010 norms. Having admitted that there is a shortage of M.Tech.faculty, it is irrational to insist upon M.Tech faculty for new courses and additional intake for existing courses.

		78. When the existing institutions have validly presented their applications as per 2006 Regulations, AICTE is bound to process the same under the said Regulations and it is not justified in refusing to process the applications and to demand the uploading of fresh applications as per the new Regulations 2010 for the year 2010-2011.

		79. In Nani Shah's case reported in (2007) 15 SCC 406, the Supreme Court has held that so far so good, but we completely fail to understand that even when there were backlog vacancies how was the Government justified in giving a  retrospective effect from 02.11.1994 in four cases and from 31.12.1994 in favour of Shri.T.Tapi. There is no justification whatsoever of giving the retrospective effect.  We, therefore, endorse the view expressed by the High Court that there was no necessity of giving the retrospective effect.  In the case of Divisional Forest Officer reported in (1996) 6 SCC 442, the Supreme Court has held that, renewal of lease not being a vested right, the application for renewal must be disposed of according to law prevailing as on that date.   In the case of State of Madhya Pradesh vs. Krishnadas Tikaram reported in 1995 Supp (1) SCC 587, the Supreme Court has held that it is settled law that the grant of renewal is a fresh grant and must be made consistent with law.  

		80. In the case of State of Tamil Nadu vs. Hind Stone reported in AIR 1981 SC 711, the Supreme Court has held that the submission was that it was not open to the Government to keep applications for the grant of leases and applications for renewal pending for a long time and then to reject them on the basis of R. 8-C notwithstanding the fact that the applications had been made long prior to the date on which Rule 8-C came into force.  In Delta Engineers case reported in (2009) 12 SCC 110, the Supreme Court has held that it is a cardinal principle of constitution that every statute is prima facie prospective unless it is expressly or by necessary implication made to have a retrospective operation.  
		81. An analysis of the above facts and the principles laid down by the Supreme Court would reveal that as per the 2006 Regulation, which was in force during which period, the existing petitioner Technical Institutions applied were required to submit their applications on or before 31.08.2009.  Accordingly, the petitioner Institutions submitted their applications for the academic year 2010-2011. The legitimate expectation of the petitioner Institutions is that their applications and petitions should be processed as provided under the Schedule; but the AICTE has failed in its statutory duty to process the applications as per the 2006 Regulations, which were the only Regulations in force at that point of time and then they were repealed by 2010 Regulation, which came in to force only on 06.02.2010, after expiry of the date of submission of the applications.  Therefore, the Regulation framed by the AICTE will have prospective effect and it cannot be applied retrospectively.

		82. It is a cardinal principle of law that every statue is prima facie prospective unless it is expressly or by necessary implication made to have a retrospective operation.  But, the rule in general is applicable where the object of the statue is to affect vested rights or to impose new burdens or to impair existing obligations. Unless there are words in the statute sufficient to show the intention of the legislature to affect existing rights, it is deemed to be prospective only.

		83. Also, in view of the clear stand taken by the Council that the new Regulations 2010 shall have only prospective effect and that the ongoing technical education programmes in the existing technical institutions shall not be affected adversely, the Council is estopped from pressing for the new norms for the existing institutions for the present academic year.  That apart, the New Regulations 2010 specifically repealed AICTE 2006 Regulations.  Such a repeal can take effect only prospectively with effect from 06.02.2010 i.e., the date of publication of New Regulations in the Gazette of Government of India and not retrospectively. Hence, AICTE 2006 Regulations alone apply for the academic year 2010-2011.   Accordingly, this court holds that the Regulations are prospective in nature.

Whether the Approval Process Hand Book to be gazetted separately ?

		84. As regards the validity of the Approval Process Hand Book, it is contended by the learned Senior Counsel for the petitioners, that the Hand Book has no force of law, as it was not gazetted, and though the regulation has been gazetted on 06.02.2010, it is mandatory on the part of the respondents to publish Approval Process Hand Book also in the gazette.

		85. On the other hand, it is vehemently contended by the respondents that under Clause 4.3 of the regulations, it is provided that the Council shall publish, from time to time, Approval Process Hand Book, detailing the procedure to process the applications of institutions and/or promoters and also under Clause 4.6, it is provided that the procedure for grant of approval shall be prescribed in the Approval Process Hand Book by the Council from time to time.

		86. In this connection, the statement of the petitioners in paragraphs 9,10,11 and 12 of the affidavit filed in support of W.P.No.6093 of 2010 is relevant :

	&quot;9. It is stated that that downloading of the earlier Approval Process Hand Book containing 114 pages was possible only for a few institutions and the on-line application format could not be downloaded from the website for many institutions, since the Server was continuously busy and not available.

	10. It is stated that another advertisement was given by AICTE in The Hindu dated 07.02.2010 giving configuration for smooth access of the web portal. However, the web portal was accessible only during the second week of February2010.

	11. It is stated that the earlier Approval Process Hand Book contained 114 pages and the subsequent version which was made available from 10.02.2010 contained only 99 pages.  It is now understood that in between there was yet another Hand Book containing 110 pages.

	12. It is stated that the contents of these Hand Books were not similar and there were several changes in the requirement at every stage.&quot;

		87. The Council did not file any counter denying these averments specifically made in the affidavit.  Therefore, the averments contained in paragraphs 9 to 12 are deemed to have been admitted by the Council to be true. When such is the position, the Council issued the impugned Regulations and published the same on 06.02.2010. The Council insisted that even the existing institutions should apply as per the new norms and standards prescribed under the Approval Process Hand Book.  Some of the drastic changes introduced under the new norms and standards are as follows :
	(a) Qualification of the faculty insisting upon post-graduation as pre-requisite qualification;
	(b) Post of Lecturer has been abolished resulting in the Lecturers facing threat of losing their employment ; and
	(c) Penal provision in Regulation 11.1. 
		
		88. A perusal of the material documents and regulations would reveal that the Approval Process Hand Book is a procedure, which forms part of the regulations and, therefore, there is no need for a separate notification in the gazette. It has also been indicated in the regulations that the Hand Book forms part of the regulations once the regulations are notified in the official gazette. In Rajendra Agricultural University v. Ashok Kumar Prasad and Others, 2010 (1) SCC 730, the Supreme Court has held that the requirement that the statute should be published in the Official Gazette is an integral part of the process of &quot;statute making&quot;. Therefore, it goes without saying that the Had Book also is notified.  

Doctrine of Legitimate Expectation :
		89. A question has been raised that there is a substantive right available to the petitioners and they expect that right has to be secured to them even on the changed Policy.  An argument was placed that they had a substantive right on the date of submissions of their application on or before 31.08.2009 as per the Regulation substantially provided under 2006 Regulation.  Accordingly, they have applied and they expected that their applications have to be processed but their applications were kept pending by the AICTE without processing for quite some time. The substantive right under 2006 Regulation for their extension of time for approval as per the schedule of dates has to be granted to them, but it is not done so. Though the learned counsel for the AICTE refuted this position stating that the Public Notice has been made on 31.12.2009, intending to promote transparency and accountability for changing the Policy in the progress in the Technical Institutions and they have framed the Regulations on 15.01.2010 and gazetted on 06.02.2010.  Therefore, the petitioners have expected that their applications have to be considered immediately after they made it. 
		90. The doctrine of legitimate expectation is well settled. A plethora of precedents elucidating the principles of doctrine of legitimate expectation is laid by the Supreme Court.  In the case of Government of Tamil Nadu vs. The Director, Directorate of Government Examination reported in 2002 (1) L.W. 732, the Supreme Court has held that the principle of legitimate expectation consists of two parts, i.e. (1) substantive and (2) procedural and that a case of substantive legitimate expectation would arise when a Government or an authority within the meaning of Article 12 of Indian Constitution, by representation or by past practice, arose expectation, which it would be within its powers to fulfil and the Court can interfere when the decision taken by the authority is arbitrary, unreasonable or not taken in public interest.  The further requirement is that the representee should suffer detriment acting upon such representation.  Another legal principle evolved by the  Supreme Court in Nagjyoti Coo-group Housing Society vs. Union of India, AIR 1993 S.C.155, is that the doctrine of legitimate expectation as in the case of audi alteram partem, cannot be put into straitjacket formula and that each case has to be weighed on its facts as to whether the doctrine of legitimate expectation is fit to be invoked or not.
		91. The said principle has been upheld by a Division Bench of this court in the case of Sakthi Rani vs. The Secretary of the Bar Council of Tamil Nadu reported in (2010) 2 L.W. 746, wherein, this court has held that insofar as the application of legitimate expectation is concerned, it is a well settled principle of law that the said principle is not a very strong right, but it is based upon various other factors and it can be invoked incidentally.  The doctrine of legitimate expectation can be invoked where there is an irreparable loss to the party and public interest does not suffer.  

		92. Doctrine of legitimate expectation is not a very strong right, but it is based upon various other factors and it can be invoked incidentally.  The doctrine of legitimate expectation can be invoked where there is an irreparable loss to the party and public interest does not suffer. Though a right based upon the legitimate expectation is not a legal right, when the expectation is legitimate, reasonable, logical and valid and a certain degree of fairness is required from the other persons, then the doctrine of legitimate expectation can be invoked. The doctrine can be invoked if the decisions of the administrative authority affect the person by depriving him of some benefit or advantage.
		93. On analysis of the above facts and principles, it is expected by the petitioners that their applications made in time as per the schedule could be processed in time, but this has not been done by the AICTE on the ground that they want to change the order to promote transparency and accountability in technical education and they kept the applications without processing.  The expectation of the petitioners are legitimate and it should be granted to them.  Therefore, on the doctrine of the legitimate expectation, the petitioners are entitled for processing all their applications to the benefit of the Doctrine.

Epilogue:
		94. It is pointed out by the Council that as many as 10,001 technical institutions inclusive of the institutions running engineering courses have applied to AICTE for various approvals required under the regulations as per the procedure prescribed, but, so far as Tamil Nadu is concerned, 309 of the existing Engineering Colleges have applied for approval as per the procedure under the Regulations of the year 2010.  It is also pleaded that out of 2,805 new institutions which have applied for approval as per the new regulations all over the country, 123 are from the State of Tamil Nadu and the Council shall process the applications of the said institutions, who opted for new regulations.

		95. Learned  counsel for the petitioners have argued one factor that there is want of faculty in every institution and therefore the respondents have relaxed the eligibility with regard to qualification for appointment of faculty members.  Though I am not opposed to that, the quality of education and the standard are to be maintained by our nation to cater to its needs reckoning with technological advancement and to compete with the multi-national developments. Such being the requirement of every institution, the authorities concerned in this regard have to give important attention to these areas in order to maintain the quality of education in our country. This concern of the Court is to be taken into account by all the authorities concerned in their future endeavour and some immediate attention is required for that purpose.

		96. For development and progress of any society,  changes are required in terms of the newer technology, financial growth and other factors, which are relevant for the introduction of a new concept, policy or a subordinate legislation. It shall be the endeavour of every authority under the Union/State to ensure that there must be a scientific approach to the issue, by undertaking survey, collecting data, forecasting all the needed growth and development of the technical education.  If the said exercise is not done, any newer concept or policy or regulation will have some adverse impact. Therefore, in the interest of nation, particularly, in the field of education, which takes the younger generation to the newer world on the advancement of technology development, the authority must bear in mind every factor before resorting to any newer concept, policy or regulation and carefully consider its effect.

		97. In the governance of the system, it is the prerogative of each Government and its organs or authority concerned to follow its own policy.  Often, a change in government or authority may result in the shift in focus or change in educational policies. Any such change may result in adversely affecting some vested interests. Unless any illegality is committed in the execution of the policy or the same is contrary to law or mala fide, a decision bringing about change cannot per se be interfered with by the Court. Wisdom and advisability of educational policies are ordinarily not amenable to judicial review, unless it can be demonstrated that the policy is contrary to any Constitutional principles or statutory provision.  In other words, it is not for this Court to consider relative merits of different policies/regulations and consider whether a wiser or better one can be evolved. But, when there is arbitrary exercise of power, the Court  can very well interfere with such policies of the Government.              

		98. In the light of my foregoing discussions and analysis of  various legal provisions, after giving due consideration to the various decisions of the Supreme Court and of this Court, and upon the material consideration of every aspect of the case, the following conclusions are arrived at : To sum up,
		(i) All India Council for Technical Education (Grant of Approvals for Technical Institutions) Regulations 2010, except Regulation 11.1, are upheld.
		(ii) Regulation 11.1 of the All India Council for Technical Education (Grant of Approvals for Technical Institutions) Regulations 2010, which contemplates civil and criminal action against the institutions, is ultra vires of the All India Council for Technical Education Act,1987, and without  authority of law. Therefore, it is struck down. However, it is open for AICTE to substitute this clause by any provision in accordance with the provisions of the Act.
		(iii) The applications of the writ petitioners who applied on or before 31.08.2009, which was the last date for filing of applications as per the AICTE Regulations,2006, for extension of approval/additional intake/introduction of new courses/variation intake shall be governed by the Regulations, 2006 and approval be granted accordingly forthwith for this academic year 2010-2011. However, approval for the next academic year will be governed by the new Regulations,2010.
		(iv) The applications of the writ petitioners who opted for new regulations shall be approved as per the new Regulations, 2010.
		(v) New Regulations 2010 shall have only prospective effect.
		(vi) Approval Process Hand Book is an integral part of the Regulations and, therefore, there is no need to publish the same in the Gazette of Government of India. 
		(vii) In its future endeavour, AICTE shall take policy decisions based on ground realities after undertaking survey in various fields of technical education, collecting data on all related matters and making forecast of the needed growth and development in the technical education, for which purpose it should consult with the stakeholders i.e, the academicians, colleges and other experts in the field, as contemplated under Section 10 (a) of the Act, affording an opportunity to the institutions concerned.
		99. Writ Petitions are disposed of accordingly.  No costs.  Consequently, the connected M.Ps. are closed.
